<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>Terminal Browser</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="terminal">
    <div id="tab-strip">
      <span id="space-label"></span>
      <span id="tab-list"></span>
    </div>
    <div id="log"></div>
    <div id="input-row">
      <span id="prompt">&gt;</span>
      <input id="command-input" type="text" autofocus autocomplete="off" spellcheck="false" />
    </div>
  </div>
  <script src="renderer.js"></script>
</body>
</html>
